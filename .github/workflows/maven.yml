
name: Agendamento Odontologico CI/CD

on:
  workflow_dispatch:
  push: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
      API_SECURITY_TOKEN_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Compilar e testar
        working-directory: ./api-odonto
        run: mvn -B clean verify

      - name: Construir imagem Docker
        run: docker build -f Dockerfile -t agendamento-odontologico:${{ github.sha }} ./api-odonto
